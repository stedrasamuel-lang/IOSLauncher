
name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          mkdir extracted
          unzip -q "IOSLauncher_GitHub_Build.zip" -d extracted

      - name: Find Gradle project
        run: |
          PROJECT=$(find extracted -name gradlew -type f -print -quit | xargs dirname)
          echo "Project found: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name:       - name: Build APK
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        run: 
          
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IOSLauncher-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
        
